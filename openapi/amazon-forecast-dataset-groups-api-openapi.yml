openapi: 3.2.0
info:
  title: Amazon Forecast Dataset Groups API
  description: Amazon Forecast is a fully managed service that uses machine learning to deliver highly accurate time-series forecasts.
  version: '2018-06-26'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://forecast.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
security:
- awsSigV4: []
tags:
- name: Dataset Groups
  description: Logical groupings of related datasets
paths:
  /dataset-groups:
    post:
      operationId: createDatasetGroup
      summary: Create Dataset Group
      description: Creates a dataset group, which holds a collection of related datasets.
      tags:
      - Dataset Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetGroupRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  DatasetGroupArn:
                    type: string
              examples:
                default:
                  x-microcks-default: true
                  value:
                    DatasetGroupArn: arn:aws:forecast:us-east-1:123456789012:dataset-group/MyDSG
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    get:
      operationId: listDatasetGroups
      summary: List Dataset Groups
      description: Returns a list of dataset groups.
      tags:
      - Dataset Groups
      parameters:
      - name: maxResults
        in: query
        schema:
          type: integer
        description: Maximum results.
      - name: nextToken
        in: query
        schema:
          type: string
        description: Pagination token.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  DatasetGroups:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatasetGroupSummary'
                  NextToken:
                    type: string
              examples:
                default:
                  x-microcks-default: true
                  value:
                    DatasetGroups:
                    - DatasetGroupArn: arn:aws:forecast:us-east-1:123456789012:dataset-group/MyDSG
                      DatasetGroupName: MyDSG
                      Domain: RETAIL
                      Status: ACTIVE
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    DatasetGroupSummary:
      type: object
      description: Summary of an Amazon Forecast dataset group.
      properties:
        DatasetGroupArn:
          type: string
        DatasetGroupName:
          type: string
        Domain:
          type: string
        Status:
          type: string
        CreationTime:
          type: string
          format: date-time
        LastModificationTime:
          type: string
          format: date-time
    Tag:
      type: object
      description: A metadata label applied to a Forecast resource.
      properties:
        Key:
          type: string
        Value:
          type: string
      required:
      - Key
      - Value
    ErrorResponse:
      type: object
      description: Standard error response from the Amazon Forecast API.
      properties:
        Message:
          type: string
        Code:
          type: string
    CreateDatasetGroupRequest:
      type: object
      required:
      - DatasetGroupName
      - Domain
      properties:
        DatasetGroupName:
          type: string
        Domain:
          type: string
        DatasetArns:
          type: array
          items:
            type: string
        Tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
  securitySchemes:
    awsSigV4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4
